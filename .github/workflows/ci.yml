# Runs on every push: backend tests against a real PostgreSQL, and a frontend build.
# The passwords below exist only inside this throwaway CI database.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: support_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      TEST_DATABASE_URL: postgresql://support_app:ci-only-app-password@localhost:5432/support_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/support_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply schema and set the app role's password
        run: |
          psql -h localhost -U postgres -d support_test -v ON_ERROR_STOP=1 -f ../db/schema.sql
          psql -h localhost -U postgres -c "ALTER ROLE support_app WITH LOGIN PASSWORD 'ci-only-app-password'"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: npm run typecheck
